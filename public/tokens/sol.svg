<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Solana">
  <defs>
    <linearGradient id="sol-g" x1="2" y1="18" x2="22" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9945FF"/>
      <stop offset="1" stop-color="#14F195"/>
    </linearGradient>
  </defs>
  <!-- Casi negro, no blanco. La marca oficial va sobre negro, pero el negro puro
       se funde con la obsidiana del fondo (#070B12) y el distintivo desaparece.
       El blanco resolvía eso a costa de destacar más que los otros cinco y
       romper la fila; #14161A se separa del fondo sin gritar, y deja que las
       tres barras se lean por separado en vez de emborronarse contra el claro. -->
  <circle cx="12" cy="12" r="12" fill="#14161A"/>
  <g fill="url(#sol-g)" transform="translate(4 5.73) scale(0.04023)">

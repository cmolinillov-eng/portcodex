<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" role="img" aria-label="PortCodex">
  <title>PortCodex — Open Ledger Monogram</title>
  <!--
    Registro abierto visto de frente: dos hojas que caen hacia el lomo central.
    La hoja izquierda es una C (abierta hacia el lomo); la derecha, una P (ojo
    arriba, asta sobre el lomo, pie abajo). El cuadro cian hace de punto decimal.

    PLANO por norma: sin halo, sin degradado, sin sombra. Los trazos usan
    currentColor para entintarse desde el componente; el acento cian va aparte
    porque se retira por debajo de 16 px.

    Cada hoja es UN SOLO trazo continuo. Dibujarlas por tramos dejaba muescas
    donde se encontraban —sobre todo en el arranque del asta—; en un recorrido
    único las uniones las resuelve el propio inglete. El miterlimit mantiene
    afilada la esquina del ojo y bisela la del pie, que si no dispara una púa.
  -->
  <g stroke="currentColor" stroke-width="8.5" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="2.2">
    <!-- Hoja izquierda — la C, abierta hacia el lomo -->
    <path d="M44 30.5 L15 17.5 L15 69.5 L44 82.5" />
    <!-- Hoja derecha — la P completa: ojo, asta y pie -->
    <path d="M63 54.5 L83 44.5 L83 18 L54 31 L54 82.5 L70 75.5" />
  </g>
  <!-- Acento: el punto decimal. Único uso del cian en la marca. -->
  <path d="M73.5 66.5 L82 62.8 L82 74 L73.5 77.7 Z" fill="#18BFD0" />
</svg>
